<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKSL Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8; --card:#FFFFFF; --card-2:#FAFBFC;
  --ink:#0E2338; --ink-2:#3C4C5C; --muted:#6E7C8A; --faint:#9AA6B2;
  --line:#E1E7ED; --line-2:#EDF1F5;
  --navy:#0E2338; --navy-2:#173350; --steel:#2F6690; --steel-2:#3A7CA5;
  --steel-soft:#EAF1F7; --steel-line:#CBDBE8;
  --accent:#C4670F; --accent-soft:#FBF0E2; --yellow:#E8B417;
  --ok:#256F52; --ok-soft:#E6F2EC; --warn:#B23B31; --warn-soft:#FBEBE9;
  --shadow:0 1px 2px rgba(14,35,56,.06), 0 4px 14px rgba(14,35,56,.05);
  --shadow-lift:0 6px 24px rgba(14,35,56,.12);
  --r:10px; --r-lg:14px; --r-sm:7px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'IBM Plex Sans','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1622; --card:#12212F; --card-2:#16273700;
    --ink:#E8EEF4; --ink-2:#BCC9D6; --muted:#8C9CAC; --faint:#6D7D8D;
    --line:#22364A; --line-2:#1B2B3C;
    --navy:#0A1520; --navy-2:#15293D; --steel:#6FA8CE; --steel-2:#89BBDC;
    --steel-soft:#16293A; --steel-line:#24405A;
    --accent:#E39B4F; --accent-soft:#2A2013; --yellow:#E8B417;
    --ok:#5FBE95; --ok-soft:#12271F; --warn:#E2857B; --warn-soft:#2A1614;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --shadow-lift:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1622; --card:#12212F; --card-2:#162737;
  --ink:#E8EEF4; --ink-2:#BCC9D6; --muted:#8C9CAC; --faint:#6D7D8D;
  --line:#22364A; --line-2:#1B2B3C;
  --navy:#0A1520; --navy-2:#15293D; --steel:#6FA8CE; --steel-2:#89BBDC;
  --steel-soft:#16293A; --steel-line:#24405A;
  --accent:#E39B4F; --accent-soft:#2A2013; --yellow:#E8B417;
  --ok:#5FBE95; --ok-soft:#12271F; --warn:#E2857B; --warn-soft:#2A1614;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lift:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:var(--head); margin:0; letter-spacing:-.01em; color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--steel);text-decoration:none}
:focus-visible{outline:2px solid var(--steel-2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{min-height:100dvh}
.shell{display:grid;grid-template-columns:1fr;min-height:100dvh}
.side{display:none}
.main{min-width:0;padding-bottom:78px}
.view{max-width:760px;margin:0 auto;padding:0 14px 32px}
@media(min-width:960px){
  .shell{grid-template-columns:232px 1fr;max-width:1240px;margin:0 auto}
  .side{display:block;position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);background:var(--card);padding:18px 12px}
  .main{padding-bottom:24px}
  .view{padding:0 26px 48px}
  .tabbar{display:none}
}

/* ---------- brand / sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-family:var(--head);font-weight:700;font-size:12.5px;letter-spacing:.02em;flex:none}
.mark.lg{width:44px;height:44px;font-size:15px;border-radius:10px}
.brand b{font-family:var(--head);font-size:15.5px;display:block;line-height:1.15}
.brand span{font-size:11.5px;color:var(--muted)}
.navlink{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:14.5px;font-weight:500;text-align:left}
.navlink .ic{width:20px;display:grid;place-items:center;color:var(--muted)}
.navlink:hover{background:var(--line-2)}
.navlink.on{background:var(--steel-soft);color:var(--steel);font-weight:600}
.navlink.on .ic{color:var(--steel)}
.side-foot{position:absolute;bottom:16px;left:12px;right:12px;font-size:11.5px;color:var(--faint)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px}
.topbar h1{font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--line-2)}
.dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.rel{position:relative}

/* ---------- day band (home hero) ---------- */
.band{background:var(--navy);color:#fff;margin:0 -14px;padding:16px 14px 14px;position:relative;overflow:hidden}
@media(min-width:960px){.band{margin:0 -26px;padding:22px 26px 18px;border-radius:0}}
.band:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 60%,rgba(111,168,206,.13) 100%)}
.band .date{font-size:11.5px;color:#93A9BE;letter-spacing:.04em;margin-bottom:9px}
.greet{display:flex;align-items:center;gap:13px}
.greet h2{color:#fff;font-size:20px;font-weight:600;line-height:1.2}
.greet p{margin:2px 0 0;font-size:12.8px;color:#9FB4C7}
.greet .sep{color:#5C748A;margin:0 5px}
.av{border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center;
  font-family:var(--head);font-weight:600;flex:none;overflow:hidden}
.av.s{width:34px;height:34px;font-size:13px}
.av.m{width:46px;height:46px;font-size:16px}
.av.l{width:64px;height:64px;font-size:21px}
.av.xl{width:82px;height:82px;font-size:27px}
.av.ring{box-shadow:0 0 0 2px var(--navy),0 0 0 3.5px rgba(255,255,255,.35)}

.punch{margin-top:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:var(--r);padding:12px 13px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.punch .stat{flex:1;min-width:88px}
.punch .stat b{display:block;font-family:var(--head);font-size:16px;color:#fff;font-weight:600}
.punch .stat span{font-size:11.5px;color:#93A9BE}
.punch .btn-punch{background:#fff;color:var(--navy);padding:9px 15px;border-radius:8px;font-weight:600;font-size:13.5px}
.punch .btn-punch.out{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.pill-live{display:inline-flex;align-items:center;gap:6px;background:rgba(95,190,149,.17);color:#8FE0BC;
  padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill-live i{width:6px;height:6px;border-radius:50%;background:#5FBE95;display:block}

/* ---------- quick actions ---------- */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-20px;position:relative;z-index:2}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 4px 9px;
  display:grid;justify-items:center;gap:6px;box-shadow:var(--shadow);font-size:11.8px;font-weight:500;color:var(--ink-2)}
.qa button:hover{border-color:var(--steel-line)}
.qa .ic{color:var(--steel)}

/* ---------- sections & cards ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.sec-h h3{font-size:15.5px;font-weight:600;flex:1}
.sec-h .more{font-size:12.8px;color:var(--steel);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.pad{padding:14px}
.pad-s{padding:11px 13px}
.rowlist > *{border-bottom:1px solid var(--line-2)}
.rowlist > *:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 13px;width:100%;text-align:left}
.row:hover{background:var(--card-2)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14.3px;font-weight:600;line-height:1.3}
.row p{margin:2px 0 0;font-size:12.6px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--faint);flex:none}
.tile-ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--steel-soft);color:var(--steel);font-size:17px}
.tile-ic.warm{background:var(--accent-soft);color:var(--accent)}
.tile-ic.good{background:var(--ok-soft);color:var(--ok)}
.tile-ic.alert{background:var(--warn-soft);color:var(--warn)}

.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;
  background:var(--steel-soft);color:var(--steel);letter-spacing:.01em;white-space:nowrap}
.tag.grey{background:var(--line-2);color:var(--muted)}
.tag.warm{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--ok-soft);color:var(--ok)}
.tag.alert{background:var(--warn-soft);color:var(--warn)}
.meta{font-size:12.3px;color:var(--muted)}
.divider{height:1px;background:var(--line-2);margin:12px 0}

/* ---------- photo slot (no fabricated photography) ---------- */
.photo{position:relative;background:
   repeating-linear-gradient(135deg,var(--steel-soft) 0 12px,transparent 12px 24px),
   linear-gradient(160deg,var(--card-2),var(--steel-soft));
  border:1px solid var(--steel-line);border-radius:var(--r-sm);overflow:hidden;display:grid;place-items:end start}
.photo.r16{aspect-ratio:16/9}
.photo.r43{aspect-ratio:4/3}
.photo.r11{aspect-ratio:1/1}
.photo cap{display:block;padding:9px 11px;font-size:12px;color:var(--steel);font-weight:500;
  text-shadow:0 1px 0 var(--card)}
.photo .stamp{position:absolute;top:7px;right:7px;font-size:9.5px;letter-spacing:.06em;color:var(--steel);
  background:var(--card);border:1px solid var(--steel-line);padding:2px 6px;border-radius:4px;opacity:.9}

/* ---------- chips / filters ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:20px;
  font-size:12.8px;font-weight:500;color:var(--ink-2);white-space:nowrap;flex:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:8px;
  font-size:14px;font-weight:600;background:var(--steel);color:#fff}
.btn:hover{background:var(--steel-2)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card-2)}
.btn.dark{background:var(--navy)}
.btn.warm{background:var(--accent)}
.btn.sm{padding:7px 12px;font-size:12.8px;border-radius:7px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12.6px;color:var(--muted);margin-bottom:5px;font-weight:500}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14.5px}
.inp:focus{border-color:var(--steel);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:12px;color:var(--faint);margin-top:-6px;margin-bottom:12px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{display:grid;justify-items:center;gap:3px;padding:4px 0;font-size:10.8px;color:var(--muted);font-weight:500}
.tabbar button.on{color:var(--steel);font-weight:600}
.tabbar .ic{height:22px;display:grid;place-items:center}

/* ---------- feed ---------- */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 13px 10px}
.post-h b{font-size:13.8px}
.post-b{padding:0 13px 12px}
.post-b h4{font-size:15.5px;margin-bottom:5px;font-weight:600}
.post-b p{margin:0;font-size:14px;color:var(--ink-2)}
.post-act{display:flex;border-top:1px solid var(--line-2)}
.post-act button{flex:1;padding:10px 4px;font-size:12.8px;color:var(--muted);font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:6px}
.post-act button:hover{background:var(--card-2)}
.post-act button.on{color:var(--warn)}
.post-act button.on.clap{color:var(--accent)}

/* ---------- misc ---------- */
.prog{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--steel);border-radius:4px}
.prog.warm i{background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}
.empty b{display:block;font-family:var(--head);color:var(--ink);font-size:15px;margin-bottom:4px}
.scroller{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:960px){.scroller{margin:0;padding-left:0;padding-right:0}}
.scroller > *{flex:none;width:238px}
.grid-c{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.banner.alert{background:var(--warn-soft);border:1px solid rgba(178,59,49,.22)}
.banner.warm{background:var(--accent-soft);border:1px solid rgba(196,103,15,.22)}
.banner b{font-size:14px;display:block;margin-bottom:2px}
.banner p{margin:0;font-size:13px;color:var(--ink-2)}

/* ---------- modal / sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,20,32,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow:auto;
  border-radius:16px 16px 0 0;box-shadow:var(--shadow-lift);animation:up .18s ease-out}
@media(min-width:700px){.sheet{border-radius:var(--r-lg);animation:pop .16s ease-out}}
@keyframes up{from{transform:translateY(18px);opacity:.6}}
@keyframes pop{from{transform:scale(.98);opacity:0}}
.sheet-h{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:13px 14px;z-index:2}
.sheet-h h3{font-size:16px;flex:1;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;z-index:120;background:var(--navy);color:#fff;
  padding:11px 17px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow-lift);max-width:90vw;text-align:center}
@media(min-width:960px){.toast{bottom:28px}}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:
  linear-gradient(180deg,var(--navy) 0 42%,var(--paper) 42% 100%)}
.login-card{width:100%;max-width:394px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lift);padding:22px}
.login h2{font-size:19px;margin-bottom:3px}
.login .lede{font-size:13.4px;color:var(--muted);margin:0 0 18px}
.login .top{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.login .top b{font-family:var(--head);font-size:17px;display:block}
.login .top span{font-size:12px;color:var(--muted)}
.demo{margin-top:14px;padding:10px 12px;background:var(--steel-soft);border-radius:8px;font-size:12.3px;color:var(--steel)}

/* ---------- attendance calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--faint);padding-bottom:4px;font-weight:600}
.cal .d{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:500;
  border:1px solid transparent;position:relative}
.cal .d.P{background:var(--ok-soft);color:var(--ok)}
.cal .d.L{background:var(--steel-soft);color:var(--steel)}
.cal .d.A{background:var(--warn-soft);color:var(--warn)}
.cal .d.H{background:var(--accent-soft);color:var(--accent)}
.cal .d.W{background:var(--line-2);color:var(--faint)}
.cal .d.T{background:var(--card);border-color:var(--steel-line);color:var(--steel)}
.cal .d.today{box-shadow:0 0 0 2px var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.8px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- home: hero carousel & culture dashboard ---------- */
.hgreet{display:flex;align-items:baseline;gap:9px;padding:14px 0 2px}
.hgreet b{font-family:var(--head);font-size:17px;font-weight:600}
.hgreet span{font-size:12.6px;color:var(--muted)}
.homegrid{display:block}
@media(min-width:1000px){
  .view.wide{max-width:1120px}
  .homegrid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:26px;align-items:start}
  .homegrid .colB{position:sticky;top:68px}
}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:0 -14px;padding:2px 14px 8px}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start;flex:none}
@media(min-width:960px){.rail{margin:0;padding:2px 0 8px}}
.hero-card{width:min(88vw,560px);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:hidden;text-align:left;display:block}
@media(min-width:1000px){.hero-card{width:100%}}
.hero-photo{position:relative}
.hero-photo .photo{border:0;border-radius:0}
.hero-over{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;color:#fff;
  background:linear-gradient(to top,rgba(8,20,32,.88),rgba(8,20,32,.45) 55%,transparent)}
.hero-over b{font-family:var(--head);font-size:17px;display:block;line-height:1.2}
.hero-over p{margin:3px 0 0;font-size:12.4px;color:#C3D2DF}
.hero-cat{position:absolute;top:11px;left:11px;background:rgba(8,20,32,.78);color:#fff;
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:5px;letter-spacing:.01em}
.hero-body{padding:13px 14px}
.hero-body p{margin:0;font-size:14.2px;color:var(--ink-2);line-height:1.5}
.hero-foot{display:flex;align-items:center;gap:10px;margin-top:11px}
.hero-foot .meta{flex:1}
.linkb{color:var(--steel);font-weight:600;font-size:13.2px}
.dots{display:flex;gap:6px;justify-content:center;padding:2px 0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;transition:width .15s}
.dots i.on{background:var(--steel);width:18px;border-radius:3px}
.pstrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 6px}
.pstrip::-webkit-scrollbar{display:none}
@media(min-width:960px){.pstrip{margin:0;padding:2px 0 6px}}
.pcard{flex:none;width:146px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:11px 12px;text-align:left}
.pcard b{font-family:var(--head);font-size:14.2px;display:block}
.pcard .c{font-size:11.5px;color:var(--steel);font-weight:600;margin-top:2px;display:block}
.pcard .n{font-family:var(--head);font-size:19px;font-weight:600;margin:9px 0 5px;display:block}
.pcard .t{font-size:11.4px;color:var(--faint);display:block;margin-top:6px}
.mem-card{width:min(76vw,300px);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block}
.mem-card .photo{border:0;border-radius:0}
.mem-body{padding:12px 13px}
.mem-body b{font-family:var(--head);font-size:15.2px;display:block;line-height:1.25}
.mem-body p{margin:4px 0 0;font-size:12.6px;color:var(--muted)}
.mem-body q{display:block;margin-top:8px;font-size:13.4px;color:var(--ink-2);font-style:italic;quotes:none}
.hol{display:flex;align-items:center;gap:12px;padding:11px 13px}
.hol .dt{flex:none;width:52px;text-align:center;font-family:var(--head);line-height:1.05}
.hol .dt b{display:block;font-size:19px;font-weight:600}
.hol .dt span{display:block;font-size:10px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.hol .grow b{display:block;font-size:14.2px}
.hol .grow p{margin:2px 0 0;font-size:12.3px;color:var(--muted)}
.qa4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa4 button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 4px 9px;
  display:grid;justify-items:center;gap:6px;box-shadow:var(--shadow);font-size:11.6px;font-weight:500;color:var(--ink-2)}
.qa4 .ic{color:var(--steel)}
.hilite{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);

.hilite .photo{border:0;border-radius:0}
.brandbar{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brandbar b{font-family:var(--head);font-size:15.5px;line-height:1.1;display:block}
.brandbar span{font-size:10.8px;color:var(--muted);display:block}
.hbanner{margin-top:13px;background:var(--navy);color:#fff;border-radius:var(--r);

.hbanner .ic{color:#8FB6D4;flex:none}
.hbanner b{font-family:var(--head);font-size:14.4px;display:block;line-height:1.3}
.hbanner p{margin:2px 0 0;font-size:12.6px;color:#A8BDD0}

  const diff = (NOW - new Date(iso))/86400000;

  if(diff < 7) return `${Math.floor(diff)} days ago`;
  return fmtDate(new Date(iso));

function sheet(title, bodyNode, opts={}){
  const scrim=el('div','scrim');
  const sh=el('div','sheet');

  h.appendChild(el('h3','',esc(title)));
  const x=el('button','iconbtn',I.close); x.setAttribute('aria-label','Close'); x.onclick=close;

           Rejected:'alert',Pending:'warm','In Progress':'warm','Under Review':'warm',Assigned:'warm',
           Submitted:'grey','With reporting manager':'warm','With HR':'warm'};

}
function field(label,name,type='text',opts){
  if(type==='select'){
    return `<label class="f"><span>${esc(label)}</span><select class="inp" name="${name}">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`;
  }

  return `<label class="f"><span>${esc(label)}</span><input class="inp" type="${type}" name="${name}" placeholder="${esc(opts||'')}" ${type==='date'?`value="${iso(0)}"`:''}></label>`;

const anniversariesToday = P.filter(p=>p.anniv);

const allFeed = () => S.newPosts.concat(FEED);

const upcomingEvent = () => allEvents().find(e=> e.date > iso(0)) || allEvents()[0];
function workedHours(){
  if(!S.punchIn) return '—';
  const pi = parseHM(S.punchIn);
  const end = S.punchOut ? parseHM(S.punchOut) : (NOW.getHours()*60+NOW.getMinutes());
  let m = Math.max(0,end-pi);
  return `${String(Math.floor(m/60)).padStart(2,'0')}h ${String(m%60).padStart(2,'0')}m`;
}
function parseHM(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function hm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function pretty(t){ if(!t) return '—'; const [h,m]=t.split(':').map(Number); const H=h%12||12; return `${String(H).padStart(2,'0')}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }

function commentSheet(p){
  const box=el('div');
  const list=el('div','rowlist');
  function paint(){
    list.innerHTML='';
    const cs=S.comments[p.id]||[];
    if(!cs.length) list.appendChild(el('div','empty','<b>No comments yet</b>Be the first to say something.'));
    cs.forEach(c=>{
      const r=el('div','row');
      r.innerHTML=`<span class="av s">${esc(initials(c.by))}</span><span class="grow"><b>${esc(c.by)}</b><p style="white-space:normal;color:var(--ink-2)">${esc(c.text)}</p></span>`;
      list.appendChild(r);
    });
  }
  paint();
  box.appendChild(list);
  const form=el('div','',`<div class="divider"></div>
    <label class="f"><span>Add a comment</span><textarea class="inp" id="cmt" placeholder="Keep it professional — colleagues across SKSL can see this."></textarea></label>
    <button class="btn block" id="cmtgo">Post comment</button>`);
  box.appendChild(form);
  const s=sheet(p.t,box);
  setTimeout(()=>{
    const ta=document.querySelector('#cmt');
    document.querySelector('#cmtgo').onclick=()=>{
      const v=ta.value.trim(); if(!v){ toast('Write something first.'); return; }
      S.comments[p.id]=(S.comments[p.id]||[]).concat([{by:ME.n,text:v}]); save(); ta.value=''; paint(); toast('Comment posted.');
    };
  },0);
}

function pulseView(){
  const f=document.createDocumentFragment();
  f.appendChild(el('p','meta','Short internal polls run by HR and the events committee. Responses follow the company privacy policy.'));
  POLLS.forEach(p=>{
    const voted=S.votes[p.id];
    const total=p.votes.reduce((a,b)=>a+b,0)+(voted!=null?1:0);
    const c=el('div','card pad'); c.style.marginTop='12px';
    let html=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <span class="tag ${p.open?'':'grey'}">${p.open?'Open':'Closed'}</span>
      <span class="meta" style="margin-left:auto">${total} responses</span></div>
      <b style="font-family:var(--head);font-size:15.2px;display:block;line-height:1.4">${esc(p.q)}</b><div style="margin-top:12px">`;
    p.opts.forEach((o,i)=>{
      const v=p.votes[i]+(voted===i?1:0);
      const pct=total?Math.round(v/total*100):0;
      if(voted!=null||!p.open){
        html+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13.6px;margin-bottom:4px">
          <span${voted===i?' style="font-weight:600;color:var(--steel)"':''}>${esc(o)}${voted===i?' · your choice':''}</span><span class="meta">${pct}%</span></div>
          <div class="prog${voted===i?'':' warm'}"><i style="width:${pct}%;${voted===i?'':'background:var(--line)'}"></i></div></div>`;
      } else {
        html+=`<button class="btn ghost block" style="margin-bottom:8px;justify-content:flex-start" data-v="${i}">${esc(o)}</button>`;
      }
    });
    html+='</div>';
    c.innerHTML=html;
    c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.votes[p.id]=Number(b.dataset.v);save();render();toast('Response recorded.');});
    f.appendChild(c);
  });
  return f;
}

function attendanceView(){
  const f=document.createDocumentFragment();
  const c=el('div','card pad');
  c.innerHTML=`<div style="display:flex;gap:14px;flex-wrap:wrap">
      <span style="flex:1;min-width:90px"><span class="meta">Punch in</span><br><b style="font-family:var(--head);font-size:18px">${esc(pretty(S.punchIn))}</b></span>
      <span style="flex:1;min-width:90px"><span class="meta">Punch out</span><br><b style="font-family:var(--head);font-size:18px">${esc(S.punchOut?pretty(S.punchOut):'—')}</b></span>
      <span style="flex:1;min-width:90px"><span class="meta">Working hours</span><br><b style="font-family:var(--head);font-size:18px">${workedHours()}</b></span>
    </div>
    <div style="margin-top:12px"><span class="pill-live" style="background:var(--ok-soft);color:var(--ok)"><i style="background:var(--ok)"></i>${S.punchOut?'Day closed':'Present today'}</span></div>`;
  f.appendChild(c);

  /* calendar */
  const s=el('section','sec'); s.appendChild(sectionHead(MONTHS[NOW.getMonth()]+' '+NOW.getFullYear()));
  const cal=el('div','card pad');
  const grid=el('div','cal');
  ['S','M','T','W','T','F','S'].forEach(d=>grid.appendChild(el('div','dow',d)));
  const first=new Date(NOW.getFullYear(),NOW.getMonth(),1);
  const days=new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate();
  for(let i=0;i<first.getDay();i++) grid.appendChild(el('div',''));
  const stats={P:0,L:0,A:0,H:0,T:0,late:0};
  for(let d=1;d<=days;d++){
    const date=new Date(NOW.getFullYear(),NOW.getMonth(),d);
    const dstr=date.toISOString().slice(0,10);
    let k;
    if(date.getDay()===0) k='W';
    else if(HOLIDAYS.some(h=>h.d===dstr)) k='H';
    else if(date>NOW) k='';
    else if(S.leave.some(l=>l.status==='Approved'&&dstr>=l.from&&dstr<=l.to)) k='L';
    else if(d%17===0) k='A';
    else if(d%11===0) k='T';
    else k='P';
    if(k==='P')stats.P++; if(k==='L')stats.L++; if(k==='A')stats.A++; if(k==='H')stats.H++; if(k==='T')stats.T++;
    if(k==='P'&&d%7===0) stats.late++;
    const cell=el('div','d '+k+(d===NOW.getDate()?' today':''),String(d));
    grid.appendChild(cell);
  }
  cal.appendChild(grid);
  cal.appendChild(el('div','legend',
    `<span><i style="background:var(--ok-soft)"></i>Present</span><span><i style="background:var(--steel-soft)"></i>Leave</span>
     <span><i style="background:var(--warn-soft)"></i>Absent</span><span><i style="background:var(--accent-soft)"></i>Holiday</span>
     <span><i style="background:var(--line-2)"></i>Weekly off</span><span><i style="background:var(--card);border:1px solid var(--steel-line)"></i>Tour / on duty</span>`));
  s.appendChild(cal); f.appendChild(s);

  const s2=el('section','sec'); s2.appendChild(sectionHead('This month'));
  const c2=el('div','card pad');
  c2.innerHTML=`<div class="kv"><span>Present days</span><b>${stats.P}</b></div>
    <div class="kv"><span>Leave</span><b>${stats.L}</b></div>
    <div class="kv"><span>Absent</span><b>${stats.A}</b></div>
    <div class="kv"><span>Tour / on duty</span><b>${stats.T}</b></div>
    <div class="kv"><span>Holidays</span><b>${stats.H}</b></div>
    <div class="kv"><span>Late entries</span><b>${stats.late}</b></div>
    <div class="kv"><span>Working hours</span><b>${stats.P*8+stats.T*8}h 20m</b></div>`;
  s2.appendChild(c2); f.appendChild(s2);

  const b=el('button','btn block ghost'); b.style.marginTop='16px'; b.textContent='Request an attendance correction';
  b.onclick=correctionSheet; f.appendChild(b);
  if(S.corrections.length){
    const s3=el('section','sec'); s3.appendChild(sectionHead('Correction requests'));
    const c3=el('div','card rowlist');
    S.corrections.forEach(c0=>c3.appendChild(rowBtn(I.clock,fmtDate(new Date(c0.date)),`${c0.issue} · corrected to ${c0.time}`,()=>toast('With '+ME.mgr+' for approval.'),statusTag(c0.status))));
    s3.appendChild(c3); f.appendChild(s3);
  }
  return f;
}

  f.appendChild(box);
  const q=searchQ.trim().toLowerCase();
  if(!q){

    const ch=el('div','chips');
    ['Leave policy','Jayant','Durga Puja','Priya Sharma','Form 16','Safety','Procurement'].forEach(t=>{
      const b=el('button','chip',esc(t)); b.onclick=()=>{searchQ=t;render();}; ch.appendChild(b); });
    s.appendChild(ch); f.appendChild(s);
    setTimeout(bindSearch,0); return f;
  }
  const groups=[
    ['People',P.filter(p=>(p.n+p.d+p.dep+p.loc).toLowerCase().includes(q)).map(p=>({t:p.n,s:p.d+' · '+p.dep,go:()=>go('person',p.id)}))],
    ['Departments',DEPTS.filter(d=>(d.n+d.head).toLowerCase().includes(q)).map(d=>({t:d.n,s:'Head: '+d.head,go:()=>go('department',d.n)}))],
    ['Notices',allNotices().filter(n=>(n.t+n.cat+n.body).toLowerCase().includes(q)).map(n=>({t:n.t,s:n.cat+' · '+ago(n.date),go:()=>go('notice',n.id)}))],
    ['Projects',PROJECTS.filter(p=>(p.n+p.client+p.loc+p.stage).toLowerCase().includes(q)).map(p=>({t:p.n,s:p.client+' · '+p.loc,go:()=>go('project',p.id)}))],
    ['Policies',POLICIES.filter(p=>(p.n+p.body).toLowerCase().includes(q)).map(p=>({t:p.n,s:'Version '+p.v,go:()=>go('policies')}))],
    ['Events',allEvents().filter(e=>(e.t+e.cat+e.venue).toLowerCase().includes(q)).map(e=>({t:e.t,s:fmtDate(new Date(e.date))+' · '+e.venue,go:()=>go('event',e.id)}))],
    ['Memories',PAST_EVENTS.filter(m=>(m.t+m.cat).toLowerCase().includes(q)).map((m,i)=>({t:m.t,s:m.cat,go:()=>go('gallery')}))],
    ['Documents',DOCS.filter(d=>d.n.toLowerCase().includes(q)).map(d=>({t:d.n,s:d.type+' · '+d.size,go:()=>go('documents')}))],
  ].filter(g=>g[1].length);
  if(!groups.length) f.appendChild(el('div','empty','<b>Nothing found</b>Try a colleague\'s name, a project or a policy.'));
  groups.forEach(([name,items])=>{
    const s=el('section','sec'); s.appendChild(sectionHead(name));
    const c=el('div','card rowlist');
    items.slice(0,6).forEach(i=>c.appendChild(rowBtn(null,i.t,i.s,i.go)));
    s.appendChild(c); f.appendChild(s);
  });
  f.appendChild(el('p','hint','Results follow your access permissions. Salary and personal records are never searchable.'));
  setTimeout(bindSearch,0);
  return f;
}
function bindSearch(){
  const i=$('#gq'); if(!i) return;
  i.focus(); i.setSelectionRange(i.value.length,i.value.length);

  i.oninput=e=>{ clearTimeout(t); const v=e.target.value; t=setTimeout(()=>{ searchQ=v; render(); },260); };
}

    r.innerHTML=`<span class="tile-ic ${n.c==='Approval'?'good':n.c==='Office Notice'?'warm':''}">${
      n.c==='Birthday'?I.cake:n.c==='Event'?I.cal:n.c==='Approval'?I.check:n.c==='Payslip'?I.pay:
      n.c==='Project Update'?I.project:n.c==='Holiday'?I.flag:I.mega}</span>
      <span class="grow"><b>${esc(n.t)}</b><p>${esc(n.c)} · ${esc(ago(n.d))}</p></span><span class="chev">${I.chev}</span>`;
    r.onclick=n.go; c.appendChild(r);
  });
  f.appendChild(c);
  const b=el('button','btn block ghost'); b.style.marginTop='14px'; b.textContent='Notification settings';
  b.onclick=()=>go('settings'); f.appendChild(b);
  return f;
}
